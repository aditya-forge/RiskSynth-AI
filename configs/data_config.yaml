# configs/data_config.yaml
# RiskSynth AI - data pipeline configuration
# (migrated from synth-bank-es; credit-risk sections kept for backward compatibility)
#
# Migration notes: docs/migration-notes.md
# Pre-migration copy: archive/configs_pre_risksynth/data_config.yaml

project:
  name: "RiskSynth AI"
  domain: "wealth_management_robo_advisory"
  schema_version: "2.0.0"          # 1.x = synth-bank-es credit-risk schema
  previous_name: "synth-bank-es"
  reference_year: 2024             # ECV/EPF 2024 microdata

data_sources:
  ine:
    base_url: "https://www.ine.es/jaxiT3/Tabla.htm"
    datasets:
      padron:
        url: "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/2853.csv"
        description: "Padrón municipal de habitantes"
        update_frequency: "anual"
      epf:
        url: "https://www.ine.es/prodyser/microdatos.htm"
        description: "Encuesta de Presupuestos Familiares"
        update_frequency: "anual"
      eff:
        description: "Encuesta Financiera de las Familias"
        source: "Banco de España"
        url: "https://www.bde.es/bde/es/areas/estadis/Otras_estadistic/Encuesta_Financi/"
        update_frequency: "trianual"
  
  banco_espana:
    base_url: "https://www.bde.es/webbde/es/estadis/"
    datasets:
      tipos_interes:
        description: "Tipos de interés TAE"
        update_frequency: "mensual"
      cirbe:
        description: "Central de Información de Riesgos"
        access: "restricted"

# ---------------------------------------------------------------------------
# INE source mapping - READ BY src/risksynth/ingest/ine.py
# Semantics verified against the microdata on 2026-11-21.
# Convention: output column (left) <- INE source column (right).
# Raw INE columns are always preserved in the per-survey parquet files for audit.
# ---------------------------------------------------------------------------
ine_source_mapping:
  # Raw microdata layout under data_pipeline.raw.path
  raw_layout:
    ecv:
      dir: "datos_2024"
      personas: "ECV_Tp_2024/CSV"            # P file: person data (16+)
      hogares: "ECV_Th_2024/CSV"             # H file: household data (HY020 lives here)
      registro_personas: "ECV_Tr_2024/CSV"   # R file: person register
      registro_hogares: "ECV_Td_2024/CSV"    # D file: household register (DB040 region, DB090 weight)
    epf:
      dir: "datos_2024_epf"
      hogar: "EPFhogar/CSV"
    epa:
      dir: "datos_3t25/CSV"
      file: "EPA_2025T3.tab"

  # When data/raw is absent, the processor rebuilds from this frozen copy of the
  # schema-1.x parquet files (they still contain the raw INE columns).
  legacy_snapshot_dir: "data/interim/legacy_v1_processed"

  ecv:
    weight_column: "PB040"                   # person cross-sectional weight
    person_id: "PB030"
    household_id_divisor: 100                # EU-SILC: household id = PB030 // 100
    household_file_id: "HB030"
    register_file_id: "DB030"
    interview_year_column: "PB110"
    birth_year_column: "PB140"               # YEAR OF BIRTH, not age
    birth_year_top_code: 1938                # oldest cohort is top-coded (age >= 86)
    columns:
      sexo: "PB150"
      nivel_estudios: "PE041"
      situacion_laboral: "PL032"
      ingresos_trabajo: "PY010G"             # gross employee cash income (kept for generator compatibility)
      renta_disponible: "HY020"              # H file only
      ccaa: "DB040"                          # D file only (already NUTS2, e.g. "ES30")
    # Net person-level income components (EU-SILC "N" variables). PY021N (company car) is
    # excluded because it is part of PY020N. This is NOT a substitute for HY020: it omits
    # household-level income (HY040-HY110) and persons under 16.
    personal_net_income_components:
      [PY010N, PY020N, PY050N, PY080N, PY090N, PY100N, PY110N, PY120N, PY130N, PY140N]

  epf:
    weight_column: "FACTOR"
    missing_value_codes: [-9]                # INE "no consta"; becomes NaN in every numeric column
    columns:
      ccaa: "CCAA"
      n_miembros: "NMIEMB"
      regimen_vivienda: "REGTEN"             # 2 = owner with mortgage (matches CAPITMENS coverage)
      edad: "EDADSP"                         # head of household, exact age
      sexo: "SEXOSP"
      nivel_estudios: "ESTUDIOSSP"
      situacion_laboral: "SITUACTSP"
      dependent_children: "NHIJOSD"
      employed_members: "NUMOCUP"
      contract_type: "TIPOCONT"              # current/last job of the head; used only when situacion_laboral == ocupado
    # Population-grossed expenditure: output = source / weight_column  (EUR / household / year)
    grossed_up_expenditure:
      gasto_total: "GASTOT"                  # total incl. imputed rent
      gasto_monetario: "GASTMON"             # monetary only = household_expenses_annual_eur
    expected_median_gasto_monetario_eur: [15000, 35000]   # sanity band (EPF 2024 ~ 22.8k)
    income:
      exact_monthly: "IMPEXAC"               # household net monthly income, exact
      bracket: "INTERIN"
      invalid_bracket_codes: [0]
      # Bracket medians measured from IMPEXAC within each INTERIN code
      bracket_impute_median:
        1: 480
        2: 800
        3: 1210
        4: 1700
        5: 2200
        6: 2700
        7: 3620
        8: 5584
        9: 7700
        10: 10120
      bracket_bounds:
        1:  [0, 499]
        2:  [500, 999]
        3:  [1000, 1499]
        4:  [1500, 1999]
        5:  [2000, 2499]
        6:  [2500, 2999]
        7:  [3000, 4999]
        8:  [5000, 6999]
        9:  [7000, 8999]
        10: [9000, null]
    debt_service:                            # monthly; negatives clipped to 0, NaN = no mortgage
      principal: "CAPITMENS"
      interest: "INTERESMENS"
    main_residence_value: "VALOREST"
    outstanding_mortgage: "CAPITPDTE"
    # Note: IMPEXACSP / INTERINPSP are the MAIN EARNER's income (exact / bracket), not spending.

  epa:
    weight_column: "FACTOREL"
    age_band_column: "EDAD1"                 # 5-year band lower bound, not exact age
    columns:
      sexo: "SEXO1"
      ccaa: "CCAA"
      situacion_laboral: "AOI"
      nivel_estudios: "NFORMA"
      ocupacion: "OCUP1"
      sector: "ACT1"
      contract_type: "DUCON1"
    age_bands:                               # code -> [min, max]; null = open-ended
      0: [0, 4]
      5: [5, 9]
      10: [10, 15]
      16: [16, 19]
      20: [20, 24]
      25: [25, 29]
      30: [30, 34]
      35: [35, 39]
      40: [40, 44]
      45: [45, 49]
      50: [50, 54]
      55: [55, 59]
      60: [60, 64]
      65: [65, null]
    # Representative age for the open band; computed at runtime as the weighted
    # median age of ECV persons aged >= 65. The fallback is used when ECV is unavailable.
    open_band_age_fallback: 75

  known_issues:
    - id: "ISSUE-01"
      status: "resolved"
      description: "ECV PB140 (year of birth) was mapped to 'edad'; EPA age bands were mixed into the same column."
      resolution: "edad = PB110 - PB140 for ECV; EPA bands become midpoints with edad_min/edad_max/edad_precision."
    - id: "ISSUE-02"
      status: "resolved"
      description: "Substring match 'IMPEXAC' mapped the main earner's income (IMPEXACSP, -9 sentinels) to 'gasto_total'."
      resolution: "Exact-name mapping; gasto_total = GASTOT / FACTOR; -9 becomes NaN."
    - id: "ISSUE-03"
      status: "resolved"
      description: "'gasto_monetario' (GASTMON) was population-grossed."
      resolution: "gasto_monetario = GASTMON / FACTOR; raw GASTMON kept."
    - id: "ISSUE-04"
      status: "blocked_on_data"
      description: "ECV HY020 is in the H file, which was never ingested."
      resolution: "P->H join on PB030 // 100 = HB030 (and D on DB030) is implemented for raw input. The current repo has no data/raw and the legacy parquet never contained the H/D files, so renta_disponible and ECV ccaa stay null until the ECV_Th/ECV_Td files are placed in data/raw."
    - id: "ISSUE-05"
      status: "resolved"
      description: "Surveys were concatenated with incompatible codes (sexo 1/2 vs 1/6, numeric vs NUTS2 regions, birth years vs ages)."
      resolution: "Independent samples cannot be row-joined. combined_base is a schema-aligned stack: harmonized codes, survey weights (peso, peso_norm), and fuente as stratum."

# Code harmonization across surveys - READ BY src/risksynth/ingest/ine.py
harmonization:
  sexo:                                      # output: 1 = male, 2 = female
    ecv: {1: 1, 2: 2}
    epf: {1: 1, 6: 2}
    epa: {1: 1, 6: 2}
  ccaa_ine_to_nuts2:                         # INE CCAA code -> NUTS2 (what generate_synthetic.py expects)
    1: "ES61"    # Andalucía
    2: "ES24"    # Aragón
    3: "ES12"    # Asturias
    4: "ES53"    # Baleares
    5: "ES70"    # Canarias
    6: "ES13"    # Cantabria
    7: "ES41"    # Castilla y León
    8: "ES42"    # Castilla-La Mancha
    9: "ES51"    # Cataluña
    10: "ES52"   # Comunitat Valenciana
    11: "ES43"   # Extremadura
    12: "ES11"   # Galicia
    13: "ES30"   # Madrid
    14: "ES62"   # Murcia
    15: "ES22"   # Navarra
    16: "ES21"   # País Vasco
    17: "ES23"   # La Rioja
    18: "ES63"   # Ceuta (EPF)
    19: "ES64"   # Melilla (EPF)
    51: "ES63"   # Ceuta (EPA)
    52: "ES64"   # Melilla (EPA)
  nivel_estudios:                            # -> demographics.education_level labels
    ecv:                                     # PE041 (ISCED 2011; 500 = all tertiary in the Spanish file)
      "000": "sin_estudios"
      "100": "primaria"
      "200": "secundaria"
      "340": "secundaria"
      "344": "secundaria"
      "350": "fp"
      "353": "fp"
      "354": "fp"
      "450": "fp"
      "500": "universitario"
    epf:                                     # ESTUDIOSSP. Codes 5-8 = tertiary (confirmed via ESTUDREDSP=4); 5 = FP superior, to verify in the EPF record layout
      1: "sin_estudios"
      2: "primaria"
      3: "secundaria"
      4: "secundaria"
      5: "fp"
      6: "universitario"
      7: "universitario"
      8: "universitario"
    epa:                                     # NFORMA
      AN: "sin_estudios"
      P1: "sin_estudios"
      P2: "primaria"
      S1: "secundaria"
      SG: "secundaria"
      SP: "fp"
      SU: "universitario"
  situacion_laboral:                         # -> demographics.employment_status labels (+ inactive subtypes)
    ecv:                                     # PL032
      "1": "ocupado"
      "2": "desempleado"
      "3": "jubilado"
      "4": "otro_inactivo"     # permanently disabled
      "5": "estudiante"
      "6": "otro_inactivo"     # domestic tasks
      "7": "otro_inactivo"
      "8": "otro_inactivo"
    epf:                                     # SITUACTSP. 1-2 = active (confirmed via SITUREDSP=1); 3 = retired
      1: "ocupado"
      2: "desempleado"
      3: "jubilado"
      4: "otro_inactivo"
      5: "otro_inactivo"
      6: "otro_inactivo"
      7: "otro_inactivo"
    epa:                                     # AOI: EPA does not separate retirees or students among inactives
      3: "ocupado"
      4: "ocupado"
      5: "desempleado"
      6: "desempleado"
      7: "inactivo"
      8: "inactivo"
      9: "inactivo"
  contract_type:
    epa: {1: "permanent", 6: "temporary"}    # DUCON1
    epf: {1: "permanent", 2: "temporary"}    # TIPOCONT; inferred from 91% share of code 1 among working heads, to verify in the EPF record layout

# combined_base.parquet: schema-aligned stack of the three surveys - READ BY src/risksynth/ingest/ine.py
combined_base:
  age_rule: "valid_age_range"                # name of the data_quality rule used to filter rows
  columns:
    - fuente
    - peso
    - peso_norm
    - edad
    - edad_min
    - edad_max
    - edad_precision
    - sexo
    - ccaa
    - nivel_estudios
    - situacion_laboral
    - n_miembros
    - regimen_vivienda
    - dependent_children
    - ingresos_trabajo
    - renta_disponible
    - renta_neta_personal_eur
    - net_income_annual_eur
    - gasto_total
    - gasto_monetario
    - debt_service_annual_eur
    - main_residence_value_eur
    - ocupacion
    - sector
    - contract_type

data_pipeline:
  raw:
    path: "data/raw"
    retention_days: 365
  
  interim:
    path: "data/interim"
    retention_days: 180
  
  processed:
    path: "data/processed"
    retention_days: 90
  
  synthetic:
    path: "data/synthetic"
    versioning: true
    format: "csv"
    compression: "gzip"

data_quality:
  validation_rules:
    - name: "no_nulls_in_key_columns"
      columns: ["client_id", "dni", "fecha_nacimiento"]
      rule: "not_null"
    
    - name: "valid_age_range"
      columns: ["edad"]
      rule: "range"
      min: 18
      max: 100
    
    - name: "valid_income"
      columns: ["ingresos_anuales"]
      rule: "positive"
    
    - name: "valid_province"
      columns: ["provincia"]
      rule: "in_list"
      values: ["Madrid", "Barcelona", "Valencia", "Sevilla", "Zaragoza"]

    # --- RiskSynth AI wealth-profile rules ---
    - name: "no_nulls_in_wealth_profile"
      columns:
        - risk_tolerance_score
        - risk_tolerance_category
        - investment_horizon_years
        - investment_horizon_bucket
        - max_acceptable_drawdown_pct
        - liquidity_need_pct
        - investable_surplus_eur
        - esg_preference_level
        - primary_investment_goal
      rule: "not_null"

    - name: "valid_risk_tolerance_score"
      columns: ["risk_tolerance_score"]
      rule: "range"
      min: 1
      max: 10
      dtype: "int"

    - name: "valid_risk_tolerance_category"
      columns: ["risk_tolerance_category"]
      rule: "in_list"
      values: ["Conservative", "Moderate", "Aggressive", "Ultra-Aggressive"]

    - name: "valid_investment_horizon"
      columns: ["investment_horizon_years"]
      rule: "range"
      min: 0.5
      max: 50

    - name: "valid_horizon_bucket"
      columns: ["investment_horizon_bucket"]
      rule: "in_list"
      values: ["Short", "Medium", "Long"]

    - name: "valid_max_drawdown"
      columns: ["max_acceptable_drawdown_pct"]
      rule: "range"
      min: 5
      max: 40

    - name: "valid_liquidity_need"
      columns: ["liquidity_need_pct"]
      rule: "range"
      min: 0
      max: 100

    - name: "non_negative_investable_surplus"
      columns: ["investable_surplus_eur"]
      rule: "range"
      min: 0
      max: 500000

    - name: "valid_esg_preference"
      columns: ["esg_preference_level"]
      rule: "in_list"
      values: ["None", "Low", "High"]

    - name: "valid_investment_goal"
      columns: ["primary_investment_goal"]
      rule: "in_list"
      values: ["Capital Preservation", "Retirement", "Wealth Growth", "Income"]

    - name: "category_matches_score"
      columns: ["risk_tolerance_score", "risk_tolerance_category"]
      rule: "derived_consistency"
      reference: "wealth_profile_schema.features.risk_tolerance_score.categories"

    - name: "bucket_matches_horizon"
      columns: ["investment_horizon_years", "investment_horizon_bucket"]
      rule: "derived_consistency"
      reference: "wealth_profile_schema.features.investment_horizon_years.buckets"

  outlier_detection:
    method: "iqr"
    threshold: 3.0
    columns: ["ingresos_anuales", "saldo_cuenta", "importe_credito", "investable_surplus_eur", "raw_surplus_eur"]

transformations:
  encoding:
    categorical_columns:
      - provincia
      - nivel_estudios
      - situacion_laboral
      - tipo_vivienda
      - risk_tolerance_category
      - investment_horizon_bucket
      - esg_preference_level
      - primary_investment_goal
    method: "label"  # o "onehot"
    # Ordinal encodings for wealth categoricals (order matters for models/metrics)
    ordinal_columns:
      risk_tolerance_category: ["Conservative", "Moderate", "Aggressive", "Ultra-Aggressive"]
      investment_horizon_bucket: ["Short", "Medium", "Long"]
      esg_preference_level: ["None", "Low", "High"]

  scaling:
    numerical_columns:
      - ingresos_anuales
      - saldo_cuenta
      - importe_credito
      - edad
      - risk_tolerance_score
      - investment_horizon_years
      - max_acceptable_drawdown_pct
      - liquidity_need_pct
      - investable_surplus_eur
    method: "standard"  # o "minmax", "robust"
    # Heavy right tail (EPF P99 ~ 48.8k EUR); robust scaling after log1p
    overrides:
      investable_surplus_eur: {pre_transform: "log1p", method: "robust"}

  feature_engineering:
    derived_features:
      - name: "ratio_deuda_ingreso"
        formula: "deuda_total / ingresos_anuales"
      - name: "antiguedad_cliente_años"
        formula: "(fecha_actual - fecha_alta).days / 365"
      - name: "scoring_simple"
        formula: "ingresos_anuales * 0.3 - deuda_total * 0.7"
      # --- RiskSynth AI (full specification in wealth_profile_schema) ---
      - name: "edad"
        formula: "PB110 - PB140"                   # ECV fix (interview year - birth year), see ISSUE-01
        source: "ECV"
      - name: "net_income_annual_eur"
        formula: "12 * (IMPEXAC if IMPEXAC > 0 else INTERIN.impute_median)"
        source: "EPF"
      - name: "household_expenses_annual_eur"
        formula: "GASTMON / FACTOR"
        source: "EPF"
      - name: "debt_service_annual_eur"
        formula: "12 * (clip0(CAPITMENS) + clip0(INTERESMENS)) + annual_consumer_debt_payments"
        source: "EPF + generator (consumer loans are not in EPF)"
      - name: "raw_surplus_eur"
        formula: "net_income_annual_eur - household_expenses_annual_eur - debt_service_annual_eur"
      - name: "investable_surplus_eur"
        formula: "max(0, raw_surplus_eur)"
      - name: "debt_service_to_income"
        formula: "debt_service_annual_eur / net_income_annual_eur"

demographics:
  # Distribución por provincias (INE 2024)
  provinces:
    Madrid:
      population: 6779888
      percentage: 14.3
      avg_income: 35000
    Barcelona:
      population: 5743402
