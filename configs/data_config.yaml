      avg_income: 32000
    Valencia:
      population: 2589312
      percentage: 5.5
      avg_income: 27000
    Sevilla:
      population: 1950219
      percentage: 4.1
      avg_income: 25000
    Zaragoza:
      population: 975896
      percentage: 2.1
      avg_income: 28000
  
  # Distribución por edad
  age_distribution:
    - range: [18, 25]
