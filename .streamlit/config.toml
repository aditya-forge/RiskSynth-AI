# RiskSynth AI - Streamlit production settings
# Dark, high-contrast, sharp-edged theme. The portal draws its own header and picks
# matching chart colours if a viewer switches to light.

[theme]
base = "dark"
primaryColor = "#1e88e5"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"
baseRadius = "none"
borderColor = "#333842"
showWidgetBorder = true

[server]
# No email prompt and no browser launch on startup (servers, containers, CI)
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
