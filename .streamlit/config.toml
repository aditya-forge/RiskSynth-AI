# RiskSynth AI - Streamlit theme: high-contrast, flat, financial-terminal light UI
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f7f9"
textColor = "#161616"
font = "sans serif"
baseRadius = "small"
borderColor = "#e4e4e4"
showWidgetBorder = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
