# RiskSynth AI - Streamlit production settings
# Two themes. The header switch loads the page with ?embed_options=light_theme or
# dark_theme, which applies [theme.light] or [theme.dark] to Streamlit's own widgets;
# the portal CSS and charts read the same option (app/portal/theme.py).

[theme]
primaryColor = "#1976d2"
font = "sans serif"
baseRadius = "small"
showWidgetBorder = true

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1f2328"
borderColor = "#d0d7de"

[theme.dark]
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
borderColor = "#30363d"

[server]
# No email prompt and no browser launch on startup (servers, containers, CI)
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
